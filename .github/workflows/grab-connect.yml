name: Connect Grab helper

on:
  push:
    branches: [main]
    paths: [".github/workflows/grab-connect.yml"]
  workflow_dispatch: # run again after changing GRAB_PLACES or ANTHROPIC_API_KEY

env:
  GRAB_WORKER_URL: https://intel-bot-grab.raj-intel.workers.dev

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send settings to the Grab helper and point Telegram at it
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GRAB_PLACES: ${{ secrets.GRAB_PLACES }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ] && {
            echo "::error::TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets are needed. See the README setup."; exit 1; }

          payload=$(python3 -c 'import json, os
          keys = ("TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID", "ANTHROPIC_API_KEY", "GRAB_PLACES")
          print(json.dumps({k: os.environ[k] for k in keys if os.environ.get(k)}))')
          result=$(curl -sS -X POST "$GRAB_WORKER_URL/setup" -H 'Content-Type: application/json' -d "$payload")
          echo "Grab helper: $result"
          echo "$result" | grep -q '"ok":true' || { echo "::error::The Grab helper refused the settings: $result"; exit 1; }

          # Same fingerprint the helper derived from the token; Telegram sends it with every message.
          secret=$(printf '%s' "$TELEGRAM_BOT_TOKEN-grab-webhook" | sha256sum | cut -c1-48)
          echo "::add-mask::$secret"
          api="https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN"
          curl -fsS "$api/setWebhook" -H 'Content-Type: application/json' -d "{
            \"url\": \"$GRAB_WORKER_URL/telegram\",
            \"secret_token\": \"$secret\",
            \"allowed_updates\": [\"message\", \"edited_message\"],
            \"drop_pending_updates\": true }" > /dev/null
          curl -fsS "$api/setMyCommands" -H 'Content-Type: application/json' -d '{"commands": [
            {"command": "help", "description": "How to ask for a ride or food"},
            {"command": "places", "description": "Your saved places"},
            {"command": "id", "description": "Show this chat ID"}]}' > /dev/null
          curl -fsS "$api/sendMessage" -H 'Content-Type: application/json' \
            -d "{\"chat_id\": \"$TELEGRAM_CHAT_ID\", \"text\": \"Grab helper is live. Try: ride to KLCC\"}" > /dev/null
          echo "Connected."
