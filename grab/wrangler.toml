# Cloudflare Worker that runs Jarvis and the Grab helper in Telegram.
# Deployed to the raj-intel.workers.dev account. Settings reach it through the
# "Connect Grab helper" workflow, never through this file.

name = "intel-bot-grab"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[kv_namespaces]]
binding = "CONFIG"
id = "b191a2b47c374b0c882ea7f5d25ac78c"

# Workers AI: listens to voice notes, and is the free fallback for thinking and speaking.
[ai]
binding = "AI"

[vars]
# Who thinks for Jarvis. "free" uses the Workers AI model below and costs nothing.
# "claude" uses the paid Anthropic API, and only if the ANTHROPIC_API_KEY secret is set.
BRAIN = "free"
AI_MODEL = "claude-haiku-5-5"
FREE_CHAT_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# Requests Jarvis will think about per day (typed or spoken). Sized to stay inside
# Cloudflare's free daily Workers AI allowance. After that he waits until 8 AM.
DAILY_AI_LIMIT = "30"

# Voice. Google's British voice is used when the GOOGLE_TTS_KEY secret is set.
# The cap stops Google use for the month before its free allowance (1 million
# characters for this voice family) runs out; the free Workers AI voice takes over.
TTS_VOICE = "en-GB-Neural2-B"
TTS_MONTHLY_CHAR_CAP = "800000"
STT_MODEL = "@cf/openai/whisper"
FREE_TTS_MODEL = "@cf/deepgram/aura-1"
FREE_TTS_SPEAKER = "helios"

# How the "Open in Grab" button opens the app. {placeholders} are filled in and
# any parameter left empty is dropped. Grab does not publish these formats for
# personal use, so if a link stops prefilling after a Grab update, adjust here.
GRAB_RIDE_LINK = "grab://open?screenType=BOOKING&pickUpLatitude={plat}&pickUpLongitude={plng}&pickUpAddress={paddr}&dropOffLatitude={dlat}&dropOffLongitude={dlng}&dropOffAddress={daddr}"
GRAB_FOOD_LINK = "grab://open?screenType=GRABFOOD&searchParameter={q}"
