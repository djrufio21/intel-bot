# Cloudflare Worker that answers your Grab requests in Telegram.
# Deployed to the raj-intel.workers.dev account. Settings reach it through the
# "Connect Grab helper" workflow, never through this file.

name = "intel-bot-grab"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[kv_namespaces]]
binding = "CONFIG"
id = "b191a2b47c374b0c882ea7f5d25ac78c"

[vars]
AI_MODEL = "claude-haiku-5-5"

# How the "Open in Grab" button opens the app. {placeholders} are filled in and
# any parameter left empty is dropped. Grab does not publish these formats for
# personal use, so if a link stops prefilling after a Grab update, adjust here.
GRAB_RIDE_LINK = "grab://open?screenType=BOOKING&pickUpLatitude={plat}&pickUpLongitude={plng}&pickUpAddress={paddr}&dropOffLatitude={dlat}&dropOffLongitude={dlng}&dropOffAddress={daddr}"
GRAB_FOOD_LINK = "grab://open?screenType=GRABFOOD&searchParameter={q}"
